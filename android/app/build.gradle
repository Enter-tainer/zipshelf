apply plugin: 'com.android.application'

// 本地签名密钥（android/keystore/debug.jks，不入库）。
// 存在就用它，不存在就退回 AGP 默认的 debug 签名（~/.android/debug.keystore）。
def localKeystore = file('../keystore/debug.jks')

android {
    namespace 'moe.mgt.zipshelf'
    compileSdk 35

    if (localKeystore.exists()) {
        signingConfigs {
            localKey {
                storeFile localKeystore
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }

    defaultConfig {
        applicationId 'moe.mgt.zipshelf'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '0.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            if (localKeystore.exists()) {
                signingConfig signingConfigs.localKey
            }
        }
        release {
            minifyEnabled false
            if (localKeystore.exists()) {
                signingConfig signingConfigs.localKey
            }
        }
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
